name: 🎁 Feature Request
description: Propose a new feature for owl
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Is owl missing a feature that you'd like to see? Feel free to propose it here.

        Before you submit a feature:
        1. Search existing issues for similar features. If you find one, 👍 it rather than opening a new one.
        2. The maintainers will try to balance the varying needs of the community when prioritizing or rejecting new features. Not all features will be accepted. owl is built around self-hosted models, so features that depend on hosted-account services are out of scope. See [Contributing](https://github.com/0xC0FFEEBEEF/Owl/blob/main/owl/docs/contributing.md) for more details.

  - type: textarea
    id: feature
    attributes:
      label: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
